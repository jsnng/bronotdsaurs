[dependencies]
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
syn = { version = "3.0.0", features = ["full", "extra-traits"] }

[dev-dependencies]
colored = "3.1.1"
rstest = "0.26.1"

[lib]
proc-macro = true
